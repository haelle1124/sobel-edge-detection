<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sobel 엣지 검출</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <header>
      <h1>Sobel 엣지 검출</h1>
      <p class="sub">이미지를 업로드하면 Sobel 필터로 윤곽선을 추출합니다.</p>
    </header>

    <section class="card">
      <label id="dropzone" class="dropzone" for="file-input" tabindex="0">
        <input id="file-input" type="file" accept="{{ accept }}" hidden>
        <span class="dz-icon" aria-hidden="true">⬆</span>
        <span class="dz-main">이미지를 끌어다 놓거나 <u>클릭해서 선택</u>하세요</span>
        <span class="dz-hint">JPG, PNG, BMP, GIF, WEBP, TIFF · 최대 {{ max_mb }}MB</span>
        <span id="file-name" class="dz-file"></span>
      </label>

      <div class="actions">
        <button id="run-btn" type="button" class="btn primary" disabled>
          <span class="spinner" aria-hidden="true"></span>
          <span class="label">엣지 검출</span>
        </button>
        <a id="download-btn" class="btn" hidden>다운로드</a>
      </div>

      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <section id="results" class="results" hidden>
      <figure>
        <figcaption>원본</figcaption>
        <div class="frame"><img id="original-img" alt="원본 이미지"></div>
      </figure>
      <figure id="result-fig" hidden>
        <figcaption>엣지 검출 결과</figcaption>
        <div class="frame"><img id="result-img" alt="엣지 검출 결과 이미지"></div>
      </figure>
    </section>
  </main>

  <script>window.MAX_MB = {{ max_mb }};</script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
